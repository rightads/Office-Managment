name: Backend CI / Verification Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Backend

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: agency_user
          POSTGRES_PASSWORD: agency_secure_password
          POSTGRES_DB: right_ads_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Code Quality (Ruff Lint)
        run: python -m ruff check .

      - name: Check Code Formatting (Ruff Format)
        run: python -m ruff format --check .

      - name: Static Type Checking (Mypy)
        run: python -m mypy app

      - name: Verify Database Migrations (Alembic Upgrade)
        env:
          DATABASE_URL: postgresql+asyncpg://agency_user:agency_secure_password@localhost:5432/right_ads_db
          JWT_SECRET_KEY: ci_environment_jwt_secret_key_at_least_32_characters_long!
        run: python -m alembic upgrade head

      - name: Run Test Suite with Coverage Enforcement (>=80%)
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          JWT_SECRET_KEY: "ci_environment_jwt_secret_key_at_least_32_characters_long!"
          RATE_LIMIT_ENABLED: "false"
          SCHEDULER_ENABLED: "false"
          ENABLE_PUSH_NOTIFICATIONS: "false"
        run: python -m pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80
