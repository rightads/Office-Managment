name: Continuous Integration & Verification Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ============================================================================
  # 1. Backend CI (FastAPI / PostgreSQL / Redis)
  # ============================================================================
  backend-ci:
    name: Backend Lint, Migrations & Tests (Pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Backend

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: agency_user
          POSTGRES_PASSWORD: agency_secure_password
          POSTGRES_DB: right_ads_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Code Quality (Ruff Lint)
        run: python -m ruff check .

      - name: Check Code Formatting (Ruff Format)
        run: python -m ruff format --check .

      - name: Static Type Checking (Mypy)
        run: python -m mypy app

      - name: Verify Database Migrations (Alembic Upgrade)
        env:
          DATABASE_URL: postgresql+asyncpg://agency_user:agency_secure_password@localhost:5432/right_ads_db
          JWT_SECRET_KEY: ci_environment_jwt_secret_key_at_least_32_characters_long!
        run: python -m alembic upgrade head

      - name: Run Test Suite with Coverage Enforcement (>=80%)
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          JWT_SECRET_KEY: "ci_environment_jwt_secret_key_at_least_32_characters_long!"
          RATE_LIMIT_ENABLED: "false"
          SCHEDULER_ENABLED: "false"
          ENABLE_PUSH_NOTIFICATIONS: "false"
        run: python -m pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80

  # ============================================================================
  # 2. Flutter Mobile & Web Client CI
  # ============================================================================
  flutter-ci:
    name: Flutter Analyze, Tests & Multi-Flavor Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Application

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Enforce Code Formatting (dart format)
        run: dart format --output=none --set-exit-if-changed .

      - name: Static Code Analysis (flutter analyze)
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Verify No Hardcoded User Strings (Part B Rule 1)
        run: flutter test test/core/l10n/no_hardcoded_strings_test.dart

      - name: Run Full Test Suite with Code Coverage
        run: flutter test --coverage

      - name: Verify Multi-Flavor Debug APK Build
        run: flutter build apk --debug --flavor dev -t lib/main_dev.dart
