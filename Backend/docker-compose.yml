version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: right_ads_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - right_ads_network

  postgres:
    image: postgres:16-alpine
    container_name: right_ads_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
      POSTGRES_DB: ${POSTGRES_DB:-right_ads_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-right_ads_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - right_ads_network

  redis:
    image: redis:7-alpine
    container_name: right_ads_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - right_ads_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  right_ads_network:
    driver: bridge
